<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hosting</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #222; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2563eb; }
        #result { margin-top: 15px; font-size: 14px; }
        a { color: #3b82f6; word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Host Your Site</h2>
        <form id="uploadForm">
            <input type="text" id="siteName" placeholder="Site Name (e.g. mypage)" required>
            <input type="file" id="siteFile" accept=".html" required>
            <button type="submit" id="submitBtn">Upload & Host</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            const siteName = document.getElementById('siteName').value;
            const file = document.getElementById('siteFile').files[0];

            const formData = new FormData();
            formData.append('siteName', siteName);
            formData.append('siteFile', file);

            btn.innerText = 'Uploading...';
            btn.disabled = true;

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    result.innerHTML = `Success! <br> <a href="${data.url}" target="_blank">Click to view your site</a>`;
                    document.getElementById('uploadForm').reset();
                } else {
                    result.innerHTML = 'Upload failed.';
                }
            } catch (err) {
                result.innerHTML = 'Error connecting.';
            } finally {
                btn.innerText = 'Upload & Host';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
